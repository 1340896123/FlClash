name: Verify and package node copy
on:
  push:
    branches: [build/copy-proxy-info-windows]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format changed Dart files
        run: |
          dart format lib/providers/actions/proxies.dart lib/views/proxies/card.dart test/providers/proxies_action_test.dart test/widgets/proxy_card_focus_test.dart
          git diff --binary > formatting.patch
      - uses: actions/upload-artifact@v4
        with:
          name: source-formatting
          path: formatting.patch
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Skip the Go core for tests
        run: yq -i '.hooks.user_defines.setup.build_assets = false' pubspec.yaml
      - name: Focused tests
        run: flutter test test/providers/proxies_action_test.dart test/widgets/proxy_card_focus_test.dart --reporter expanded
      - name: Widget, proxies view and lint suites
        run: dart run tool/test.dart test/widgets test/lint test/views/proxies_list_test.dart test/views/proxies_group_offsets_test.dart -- --reporter expanded
  windows:
    if: ${{ !contains(github.event.head_commit.message, '[tests-only]') }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/helper
            plugins/rust_api/rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Enable long paths
        run: git config --global core.longpaths true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows installer and portable package
        run: dart setup.dart windows --env stable --targets exe,zip -v
      - uses: actions/upload-artifact@v4
        with:
          name: FlClash-windows-node-copy
          path: dist/
